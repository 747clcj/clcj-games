<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألعاب CLCJ (نسخة بدون إنترنت)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fbf6ff;--fg:#2a1a4a;--card:#fff;--line:#e3d9f5;--gold:#b8860b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f26;--fg:#f4efff;--card:#231a3d;--line:#3a2d5c;--gold:#ffc400}}
:root[data-theme="dark"]{--bg:#150f26;--fg:#f4efff;--card:#231a3d;--line:#3a2d5c;--gold:#ffc400}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,Arial,sans-serif;padding:18px 14px 40px}
.w{max-width:860px;margin:0 auto}
h1{text-align:center;margin:6px 0 14px;font-size:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 16px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:11px 18px;font-weight:bold;background:var(--card);color:var(--fg);border:2px solid var(--line)}
button.on,button.go{background:#8f4dff;color:#fff;border-color:#8f4dff}
button.go{background:#ff3d6e;border-color:#ff3d6e}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
textarea{width:100%;min-height:84px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:10px}
label{font-weight:bold;display:block;margin-bottom:6px}
.sec{display:none}.sec.on{display:block}
.center{text-align:center}
canvas{max-width:100%;height:auto}
.res{font-size:30px;font-weight:900;color:var(--gold);margin:10px 0;min-height:44px}
.q{font-size:26px;font-weight:bold;margin:8px 0}.q small{display:block;font-size:20px;opacity:.85;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sq{border-radius:20px;padding:14px;color:#fff;font-weight:bold}
.sq h3{margin:0 0 8px;font-size:20px}.sq ul{margin:0;padding:0 18px;font-weight:normal}
.sq button{margin-top:8px;padding:6px 12px;font-size:13px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts button{padding:16px 8px;font-size:17px;color:#fff;border:0}
.word{font-size:34px;font-weight:900;margin:14px 0}
.fb{min-height:30px;font-weight:bold;font-size:20px}
.stat{display:flex;justify-content:space-between;font-weight:bold}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:#5fd12a;transition:width .3s}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.15)}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:2px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.row b{min-width:90px}.row .bar{flex:1;min-width:120px;margin:0}.row button{padding:6px 12px;font-size:13px}
.chips{display:flex;gap:6px}.chips img{width:30px;height:42px;border-radius:6px;opacity:.25;filter:grayscale(1);cursor:pointer;transition:.2s}.chips img.on{opacity:1;filter:none;transform:scale(1.1)}
#rev{position:fixed;inset:0;display:none;background:rgba(10,5,25,.82);z-index:50;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;padding:20px}
#rev img{width:min(60vw,260px);animation:rv 1s ease-out}#rev h2{font-size:28px;margin:14px 0 4px}
@keyframes rv{0%{transform:scale(.2) rotate(-25deg);opacity:0}70%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tf button{padding:16px;font-size:18px;color:#fff;border:0}#qt{font-size:22px}
input[type=number]{width:100%;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
.wipe{animation:wp 1.4s .4s forwards}@keyframes wp{to{clip-path:inset(0 0 0 100%);opacity:.2}}.rub{position:absolute;top:38%;right:-10px;font-size:60px;animation:rb 1.4s .4s forwards}@keyframes rb{from{transform:translateX(0)}to{transform:translateX(-240px)}}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}.mini{width:22px;height:31px;border-radius:4px;vertical-align:middle;margin-inline-end:3px}h3{margin:4px 0 10px}
</style></head><body><div class="w">
<h1>🏅 ألعاب CLCJ</h1>
<div class="center"><button id="snd">🔊 الصوت شغال</button></div>
<div class="center" id="sync" style="margin:10px 0;font-weight:bold"></div>
<div class="card"><label for="names">أسماء المشاركين (كل اسم في سطر أو افصل بينهم بفاصلة)</label>
<textarea id="names" placeholder="مثال: أحمد، سارة، منى، يوسف"></textarea></div>
<div class="tabs"><button class="on" data-t="wheel">🎡 Who are you</button><button data-t="squad">🛡️ The Squad</button><button data-t="sort">🧢 What is Coaching</button><button data-t="xp">⭐ XP & Badges</button><button data-t="agree">📜 الاتفاقية</button><button data-t="sum">📊 الملخص</button></div>

<div class="sec on" id="wheel"><div class="card center">
<canvas id="cv" width="420" height="420"></canvas>
<div class="res" id="win"></div>
<button class="go" id="spin">لفّ العجلة</button>
<hr style="border:0;border-top:2px solid var(--line);margin:16px 0">
<button id="askb">🎲 اسحب سؤال</button>
<div class="q" id="ask"></div></div></div>

<div class="sec" id="squad"><div class="card center">
<label for="n">عدد الـ Squads</label>
<div style="display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap">
<select id="n" style="font:inherit;padding:10px;border-radius:12px"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
<button class="go" id="mk">قسّم واختار الأسماء</button></div></div>
<div class="grid" id="sqs"></div></div>

<div class="sec" id="sort"><div class="card center">
<div class="stat"><span id="sc">النقاط: 0</span><span id="pg">1/10</span><span id="st">🔥 0</span></div>
<div class="bar"><i id="pb"></i></div>
<div class="word" id="wd">جاهز؟</div>
<div class="fb" id="fb">الكلمة دي بتوصف أنهي دور؟</div>
<div class="opts" id="op"></div>
<div style="margin-top:14px"><button class="go" id="st2">ابدأ اللعبة</button></div></div></div>
<div class="sec" id="xp"><div class="card"><div class="grid" style="grid-template-columns:1fr 1fr"><div><label for="xh">نقاط الواجب</label><input id="xh" type="number" value="10"></div><div><label for="xt">نقاط الالتزام بالوقت</label><input id="xt" type="number" value="5"></div></div>
<p class="center" style="margin:10px 0 0">الهدف: 100 XP عشان تبقى Superhuman. البادجات بتتمنح من غير طلب. الماسح (Eraser) بيتدي لآخر واحد يدخل السيشن، وبيمسح له بادج من اللي أخدها.</p><div class="center" style="margin-top:10px"><button id="xr">إعادة ضبط الكل</button></div></div><div id="xl"></div></div>
<div class="sec" id="agree"><div class="card center"><div class="stat"><span id="qsc">النقاط: 0</span><span id="qp">1/10</span></div><div class="bar"><i id="qpb"></i></div>
<div class="q" id="qt">Online CLCJ Rules<small>قواعد الدورة أونلاين</small></div><div class="fb" id="qf"></div><div class="tf" id="qb"></div><div style="margin-top:14px"><button class="go" id="qs2">ابدأ الكويز</button></div></div></div>
<div class="sec" id="sum"><div class="center" style="margin-bottom:12px"><button id="ex1">⬇️ تصدير المشاركين (CSV)</button> <button id="ex2">⬇️ تصدير سجل الألعاب (CSV)</button></div><div class="card"><label for="lec">اسم المحاضر (بيتكتب في النسخة الاحتياطية)</label><input id="lec" type="text" style="width:100%;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;margin-bottom:10px">
<div class="center"><button id="bk">💾 نسخة احتياطية</button> <button id="rb">♻️ استعادة نسخة</button> <button id="im">📥 استيراد ملف محاضر آخر</button> <button id="ci">🗑️ مسح المستورد</button></div></div>
<input type="file" id="fi1" accept=".json" hidden><input type="file" id="fi2" accept=".json" multiple hidden>
<div id="sumb"></div></div>
<div id="rev"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let ctx=null,muted=false;
function ac(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();}catch(e){}return ctx}
function tone(f,t,d,type='sine',g=.2,to){const c=ac();if(!c||muted)return;const o=c.createOscillator(),n=c.createGain(),T=c.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,T);if(to)o.frequency.exponentialRampToValueAtTime(to,T+d);n.gain.setValueAtTime(.0001,T);n.gain.exponentialRampToValueAtTime(g,T+.01);n.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(n);n.connect(c.destination);o.start(T);o.stop(T+d+.05)}
const good=()=>{tone(784,0,.15,'triangle');tone(1175,.12,.4,'triangle')},bad=()=>tone(180,0,.35,'sawtooth',.2,90),tick=()=>tone(900,0,.04,'square',.06),fan=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.5,'triangle',.18));
$('snd').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇 الصوت مقفول':'🔊 الصوت شغال'};
// names
try{$('names').value=localStorage.getItem('clcj_names')||''}catch(e){}
const getNames=()=>$('names').value.split(/[\n,،]+/).map(s=>s.trim()).filter(Boolean);
$('names').oninput=()=>{try{localStorage.setItem('clcj_names',$('names').value)}catch(e){};draw(rot);saveRoster()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t))});
// wheel
const COL=['#ff3d6e','#8f4dff','#ffc400','#17a8f0','#5fd12a','#ff7a1a'],cv=$('cv'),g=cv.getContext('2d');let rot=0,spinning=false;
function draw(r){const L=getNames(),n=L.length||1,seg=2*Math.PI/n,R=205;g.clearRect(0,0,420,420);g.save();g.translate(210,210);
 for(let i=0;i<n;i++){g.beginPath();g.moveTo(0,0);g.arc(0,0,R,r+i*seg,r+(i+1)*seg);g.fillStyle=L.length?COL[i%COL.length]:'#8f4dff';g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();
  if(L.length){g.save();g.rotate(r+(i+.5)*seg);g.fillStyle='#fff';g.font='bold 20px Tahoma,Arial';g.textAlign='right';g.fillText(L[i].slice(0,14),R-16,7);g.restore()}}
 g.beginPath();g.arc(0,0,26,0,7);g.fillStyle='#ffc400';g.fill();g.restore();
 g.fillStyle='#1a1030';g.beginPath();g.moveTo(210,8);g.lineTo(196,-8+8);g.lineTo(224,0);g.closePath();g.fillStyle='#ffc400';g.fill();g.strokeStyle='#1a1030';g.lineWidth=3;g.stroke()}
draw(0);
$('spin').onclick=()=>{const L=getNames();if(L.length<2||spinning){$('win').textContent=L.length<2?'اكتب اسمين على الأقل':'';return}
 spinning=true;ac();const n=L.length,seg=2*Math.PI/n,start=rot,tot=Math.PI*2*(5+Math.random()*3)+Math.random()*7,D=4200,t0=performance.now();let last=-1;
 (function f(now){const u=Math.min(1,(now-t0)/D),e=1-Math.pow(1-u,3);rot=start+tot*e;draw(rot);
  const idx=Math.floor((((-Math.PI/2-rot)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/seg);if(idx!==last){last=idx;tick()}
  if(u<1)requestAnimationFrame(f);else{spinning=false;$('win').textContent='🎉 '+L[idx];logGame({g:'wheel',w:L[idx]});$('win').classList.remove('pop');void $('win').offsetWidth;$('win').classList.add('pop');fan()}})(t0)};

let names=[];const used=new Set();
function nm(){for(let i=0;i<60;i++){const s=ADJ[Math.floor(Math.random()*ADJ.length)]+' '+NOUN[Math.floor(Math.random()*NOUN.length)];if(!used.has(s)){used.add(s);return s}}return 'Squad'}
$('mk').onclick=()=>{const L=getNames(),n=+$('n').value;used.clear();if(L.length<n){$('sqs').innerHTML='<div class="card">محتاج '+n+' أسماء على الأقل في الخانة فوق</div>';return}
 for(let i=L.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[L[i],L[j]]=[L[j],L[i]]}
 const S=Array.from({length:n},()=>[]);L.forEach((x,i)=>S[i%n].push(x));names=S.map(()=>nm());logGame({g:'squads',n:n,sq:S.map((m,i)=>names[i]+': '+m.join('، '))});
 $('sqs').innerHTML=S.map((m,i)=>`<div class="sq" style="background:${SC[i]}"><h3 id="sn${i}">🛡️ ${names[i]}</h3><ul>${m.map(x=>'<li>'+x.replace(/</g,'&lt;')+'</li>').join('')}</ul><button data-i="${i}">🎲 اسم تاني</button></div>`).join('');
 $('sqs').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('sn'+b.dataset.i).textContent='🛡️ '+nm();tone(700,0,.15,'triangle')});fan()};
// sort game
const T={Therapy:['Clinical','Analysis','Diagnosis','Problem-Focused','Process the past','Healing','Licensed'],Consulting:['Evaluation','Advise','Recommend','Implementation','Specific expertise','Project-base','Consultant-Directing'],Mentoring:['Guidance','Experience-Based','Role Model','Seniority','Supportive','Mentor-Directed','Sharing insights'],Coaching:['Collaborative','Creative','Empowering','Goal-Oriented','Self-Directed','Positive-Focused','Structured']};
const TC={Therapy:'#8a1c3c',Consulting:'#1c6fb5',Mentoring:'#0f8f82',Coaching:'#b8860b'};
let deck=[],ci=0,score=0,streak=0,lock=false;
function next(){if(ci>=deck.length){logGame({g:'sort',s:score,t:deck.length});$('wd').textContent='🏆 '+score+' / '+deck.length;$('fb').textContent=score>=8?'ممتاز! فاهم الفرق':'حلو، نراجع الفرق تاني';$('op').innerHTML='';$('st2').textContent='العب تاني';$('st2').style.display='';fan();return}
 $('wd').textContent=deck[ci][0];$('fb').textContent='الكلمة دي بتوصف أنهي دور؟';$('pg').textContent=(ci+1)+'/'+deck.length;$('pb').style.width=(ci/deck.length*100)+'%';lock=false;
 $('op').innerHTML=Object.keys(T).map(k=>`<button data-k="${k}" style="background:${TC[k]}">${k}</button>`).join('');
 $('op').querySelectorAll('button').forEach(b=>b.onclick=()=>pick(b.dataset.k))}
function pick(k){if(lock)return;lock=true;const ok=k===deck[ci][1];
 if(ok){score++;streak++;good();$('fb').textContent='✅ صح!';$('wd').classList.remove('pop');void $('wd').offsetWidth;$('wd').classList.add('pop')}else{streak=0;bad();$('fb').textContent='❌ الإجابة: '+deck[ci][1];$('wd').classList.remove('shake');void $('wd').offsetWidth;$('wd').classList.add('shake')}
 $('sc').textContent='النقاط: '+score;$('st').textContent='🔥 '+streak;ci++;setTimeout(next,1300)}

const allEV=()=>EV.concat(...Object.values(IMP).map(s=>s.EV||[])).sort((a,b)=>b.at-a.at);
function persistAll(){try{localStorage.setItem('clcj_xp',JSON.stringify(XS));localStorage.setItem('clcj_names',$('names').value);localStorage.setItem('clcj_ev',JSON.stringify(EV.slice(0,300)));localStorage.setItem('clcj_gm',JSON.stringify(GM.slice(0,300)))}catch(e){}}
$('bk').onclick=()=>{const d=new Date(),f='clcj_backup_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';DL.save({filename:f,mime:'application/json',data:JSON.stringify({v:1,dev:DEV,label:$('lec').value||'محاضر',at:Date.now(),names:$('names').value,XS:XS,EV:EV,GM:GM})})};
$('rb').onclick=()=>$('fi1').click();
$('fi1').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!s||s.v!==1)throw 0;if(!(await askOK('هيستبدل بيانات الجهاز ده بالنسخة دي. متأكد؟')))return;XS=s.XS||{};EV=s.EV||[];GM=s.GM||[];$('names').value=s.names||'';persistAll();draw(rot);rx();rs()}catch(x){note('الملف مش نسخة احتياطية صالحة')}e.target.value=''};
$('im').onclick=()=>$('fi2').click();
$('fi2').onchange=async e=>{for(const f of e.target.files){try{const s=JSON.parse(await f.text());if(!s||s.v!==1||!s.dev)throw 0;if(s.dev===DEV){note('الملف ده من الجهاز ده نفسه: '+f.name);continue}IMP[s.dev]={label:s.label,at:s.at,XS:s.XS||{},EV:s.EV||[],GM:s.GM||[]}}catch(x){note('ملف غير صالح: '+f.name)}}
 try{localStorage.setItem('clcj_imp',JSON.stringify(IMP))}catch(x){}e.target.value='';rs()};
$('ci').onclick=async()=>{if(Object.keys(IMP).length&&await askOK('مسح كل الملفات المستوردة؟')){IMP={};try{localStorage.setItem('clcj_imp','{}')}catch(e){}rs()}};
(async()=>{try{DB=await claude.use('db')}catch(e){DB=null}
 if(DB){try{const u=await claude.use('user');if(u){const c=await u.can('data.write');if(c===false)RO=true}}catch(e){}
  XS={};
  DB.doc('meta/roster').onSnapshot(s=>{if(s.exists){const t=(s.data()||{}).text||'';if(t!==$('names').value&&document.activeElement!==$('names')){$('names').value=t;draw(rot);rx()}}else if($('names').value)saveRoster()},syncErr);
  DB.collection('participants').onSnapshot(s=>{const m={};s.docs.forEach(d=>{const v=d.data();if(v&&v.name)m[v.name]={x:v.x||0,b:v.b||[],e:v.e||0,u:v.u||''}});XS=m;rx();rs()},syncErr);
  DB.collection('events').orderBy('at','desc').limit(300).onSnapshot(s=>{EV=s.docs.map(d=>d.data());rs()},syncErr);
  DB.collection('games').orderBy('at','desc').limit(300).onSnapshot(s=>{GM=s.docs.map(d=>d.data());rs()},syncErr)}
 setSync();rs()})();
rs();setSync();
</script></body></html>
